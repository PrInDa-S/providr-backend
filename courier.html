<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Providr — Courier Fleet Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0d11; color: #fff; padding: 18px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #232b3b; padding-bottom: 14px; }
    h1 { font-size: 22px; font-weight: 800; }
    .driver-badge { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    /* Earnings Summary */
    .earnings-card {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      border: 1px solid #6366f1;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .earnings-val { font-size: 24px; font-weight: 800; color: #10b981; }
    
    /* Order Cards */
    .order-card { background: #131720; border: 1.5px solid #232b3b; border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .order-id { font-size: 15px; font-weight: 800; color: #818cf8; }
    .payout-tag { background: rgba(16, 185, 129, 0.2); color: #10b981; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }

    /* Stops Route */
    .stop-row { display: flex; gap: 12px; margin-bottom: 14px; position: relative; }
    .stop-num { width: 26px; height: 26px; border-radius: 13px; background: #1e2430; border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #38bdf8; }
    .stop-num.done { background: #10b981; border-color: #10b981; color: #fff; }
    .stop-info { flex: 1; }
    .stop-title { font-weight: 700; font-size: 14px; }
    .stop-desc { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    /* Action Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    button { padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-action { background: #3b82f6; color: #fff; }
    .btn-delivered { background: #10b981; color: #fff; }
    .btn-nav { background: #1e2430; border: 1px solid #334155; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛵 Courier Fleet</h1>
      <span class="driver-badge">Online • Ready</span>
    </div>

    <!-- Earnings Overview -->
    <div class="earnings-card">
      <div>
        <div style="font-size: 12px; color: #94a3b8;">Today's Payout</div>
        <div class="earnings-val">€14.00</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 12px; color: #94a3b8;">Completed Trips</div>
        <div style="font-size: 20px; font-weight: 800;">4</div>
      </div>
    </div>

    <h2 style="font-size: 16px; margin-bottom: 12px; color: #cbd5e1;">Active Assigned Deliveries</h2>
    <div id="courierOrders">
      <p style="color: #94a3b8; font-size: 14px;">Loading active jobs...</p>
    </div>
  </div>

  <script>
    async function fetchCourierJobs() {
      try {
        const res = await fetch('/api/merchant/orders');
        const orders = await res.json();
        const container = document.getElementById('courierOrders');
        container.innerHTML = '';

        if (!orders || orders.length === 0) {
          container.innerHTML = '<p style="color: #94a3b8; font-size: 14px;">No active delivery jobs right now.</p>';
          return;
        }

        orders.slice(0, 3).forEach(order => {
          const card = document.createElement('div');
          card.className = 'order-card';

          card.innerHTML = `
            <div class="order-header">
              <span class="order-id">${order.id}</span>
              <span class="payout-tag">+€3.50 Payout</span>
            </div>

            <!-- Stop 1: Groceries -->
            <div class="stop-row">
              <div class="stop-num">1</div>
              <div class="stop-info">
                <div class="stop-title">🛒 Stop 1: QuickHub Groceries</div>
                <div class="stop-desc">Pick up packed ambient & chilled items</div>
              </div>
            </div>

            <!-- Stop 2: Restaurant -->
            <div class="stop-row">
              <div class="stop-num">2</div>
              <div class="stop-info">
                <div class="stop-title">🍕 Stop 2: Restaurant Kitchen</div>
                <div class="stop-desc">Collect hot prepared order in thermal bag</div>
              </div>
            </div>

            <!-- Stop 3: Customer -->
            <div class="stop-row">
              <div class="stop-num">3</div>
              <div class="stop-info">
                <div class="stop-title">🏠 Stop 3: Customer Drop-off</div>
                <div class="stop-desc">${order.delivery_address || 'Customer Location'}</div>
              </div>
            </div>

            <div class="btn-group">
              <button class="btn-nav" onclick="openNav('${order.delivery_address || 'Frankfurt, Germany'}')">
                🗺️ Navigate in Google Maps
              </button>
              <button class="btn-action" onclick="updateOrderStatus('${order.id}', 'COURIER_PICKED_UP_GROCERIES')">
                ✓ Collected Groceries (Stop 1)
              </button>
              <button class="btn-action" onclick="updateOrderStatus('${order.id}', 'COURIER_PICKED_UP_FOOD')">
                ✓ Collected Hot Food (Stop 2)
              </button>
              <button class="btn-delivered" onclick="updateOrderStatus('${order.id}', 'DELIVERED')">
                ✅ Complete & Delivered
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function openNav(destination) {
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}`, '_blank');
    }

    async function updateOrderStatus(orderId, status) {
      await fetch('/api/merchant/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status })
      });
      alert('Status updated to: ' + status);
      fetchCourierJobs();
    }

    fetchCourierJobs();
    setInterval(fetchCourierJobs, 6000);
  </script>
</body>
</html>
