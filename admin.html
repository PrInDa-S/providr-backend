<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Providr — Store & Menu Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #fff; padding: 24px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .badge { background: #3b82f6; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: 700; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: #1e293b; border: 1.5px solid #334155; border-radius: 12px; padding: 20px; }
    h2 { font-size: 17px; font-weight: 700; margin-bottom: 14px; color: #38bdf8; }
    
    label { font-size: 13px; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 10px; font-size: 14px; margin-bottom: 12px; }
    button { background: #3b82f6; color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; }
    button:hover { background: #2563eb; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th { text-align: left; background: #0f172a; padding: 10px; color: #94a3b8; border-bottom: 1px solid #334155; }
    td { padding: 10px; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ Providr Store & Menu Manager <span class="badge">Admin Hub</span></h1>
      <a href="/" style="color: #38bdf8; font-size: 13px; text-decoration: none;">➔ Back to App</a>
    </div>

    <div class="grid">
      <!-- 1. Add New Partner Store -->
      <div class="card">
        <h2>🏪 Onboard New Store / Partner</h2>
        <label>Store ID (Unique slug)</label>
        <input id="storeId" placeholder="e.g. m_shawarma" />

        <label>Store Name</label>
        <input id="storeName" placeholder="e.g. Al-Beirut Shawarma & Falafel" />

        <label>Store Type</label>
        <select id="storeType">
          <option value="restaurant">Restaurant (Hot Food)</option>
          <option value="grocery">Grocery Store (Essentials/Drinks)</option>
        </select>

        <label>Prep Time (Minutes)</label>
        <input id="storePrep" type="number" placeholder="15" value="15" />

        <label>Store Address</label>
        <input id="storeAddress" placeholder="e.g. MM Alam Road, Gulberg, Lahore" />

        <button onclick="addMerchant()">+ Save Store to Cloud</button>
      </div>

      <!-- 2. Add New Menu Item -->
      <div class="card">
        <h2>🍽️ Add Item / Dish to Catalog</h2>
        <label>Select Store</label>
        <select id="itemStoreSelect">
          <option value="">Loading stores...</option>
        </select>

        <label>Item Name</label>
        <input id="itemName" placeholder="e.g. Chicken Shawarma Roll (Large)" />

        <label>Price (€ EUR)</label>
        <input id="itemPrice" type="number" step="0.01" placeholder="6.50" />

        <label>Description (AI uses this to match cravings)</label>
        <textarea id="itemDesc" placeholder="Grilled chicken with garlic toum sauce, pickles, and crispy fries in pita." rows="2"></textarea>

        <button onclick="addItem()" style="background: #10b981;">+ Add Item to Catalog</button>
      </div>
    </div>

    <!-- Live Cloud Catalog Table -->
    <div class="card">
      <h2>📋 Active Cloud Catalog (Live from Supabase)</h2>
      <div id="catalogView">
        <p style="color: #94a3b8;">Loading catalog...</p>
      </div>
    </div>
  </div>

  <script>
    async function loadCatalog() {
      try {
        const res = await fetch('/api/admin/catalog');
        const data = await res.json();
        
        const storeSelect = document.getElementById('itemStoreSelect');
        storeSelect.innerHTML = '';
        data.merchants.forEach(m => {
          storeSelect.innerHTML += `<option value="${m.id}">${m.name} (${m.type})</option>`;
        });

        const container = document.getElementById('catalogView');
        let html = '<table><thead><tr><th>Store</th><th>Item Name</th><th>Price</th><th>Description</th></tr></thead><tbody>';
        
        data.items.forEach(it => {
          const store = data.merchants.find(m => m.id === it.merchant_id);
          html += `<tr>
            <td style="color: #38bdf8; font-weight: 600;">${store ? store.name : it.merchant_id}</td>
            <td style="font-weight: 700;">${it.name}</td>
            <td style="color: #10b981; font-weight: 700;">€${Number(it.price).toFixed(2)}</td>
            <td style="color: #cbd5e1; font-size: 12px;">${it.description || ''}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      } catch (e) {
        console.error(e);
      }
    }

    async function addMerchant() {
      const id = document.getElementById('storeId').value.trim();
      const name = document.getElementById('storeName').value.trim();
      const type = document.getElementById('storeType').value;
      const prep_time_minutes = Number(document.getElementById('storePrep').value) || 15;
      const address = document.getElementById('storeAddress').value.trim();

      if (!id || !name) return alert('Please enter Store ID and Name.');

      const res = await fetch('/api/admin/merchants', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, type, prep_time_minutes, address })
      });
      const data = await res.json();
      alert(data.message || 'Store saved!');
      loadCatalog();
    }

    async function addItem() {
      const merchant_id = document.getElementById('itemStoreSelect').value;
      const name = document.getElementById('itemName').value.trim();
      const price = Number(document.getElementById('itemPrice').value);
      const description = document.getElementById('itemDesc').value.trim();
      const id = 'it_' + Date.now();

      if (!name || isNaN(price)) return alert('Please enter Item Name and Price.');

      const res = await fetch('/api/admin/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, merchant_id, name, price, description })
      });
      const data = await res.json();
      alert(data.message || 'Item added!');
      loadCatalog();
    }

    loadCatalog();
  </script>
</body>
</html>
