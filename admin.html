<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAISON — Atelier & Purveyor Portfolio</title>
  <!-- Google Luxury Fonts: Cinzel, Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: #08080a;
      color: #f1f1f3;
      display: flex;
      justify-content: center;
      padding: 30px 20px;
      background-image: radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 70%);
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 960px; }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(197, 160, 89, 0.25);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #f5f5f7;
      text-transform: uppercase;
    }
    .brand-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #c5a059;
      font-size: 13px;
      letter-spacing: 0.8px;
      margin-top: 4px;
    }
    .header-links a {
      color: #c5a059;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 2px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 8px 14px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .header-links a:hover {
      background: rgba(197, 160, 89, 0.1);
      border-color: #c5a059;
    }

    /* Grid Layout */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    /* Luxury Cards */
    .card {
      background: rgba(18, 18, 22, 0.85);
      border: 1px solid rgba(197, 160, 89, 0.25);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: #c5a059;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* Inputs */
    label {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #f4f4f5;
      padding: 12px;
      font-size: 13.5px;
      margin-bottom: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(197, 160, 89, 0.6);
    }

    /* Action Buttons */
    .btn-gold {
      width: 100%;
      background: linear-gradient(135deg, #c5a059 0%, #a47e38 100%);
      color: #08080a;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s;
    }
    .btn-gold:hover { opacity: 0.92; }

    /* Luxury Table */
    .table-wrapper { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c5a059;
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid rgba(197, 160, 89, 0.3);
      background: rgba(14, 14, 18, 0.7);
    }
    td {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #d4d4d8;
    }
    tr:hover td { background: rgba(197, 160, 89, 0.03); }
    .price-tag {
      font-family: 'Cinzel', serif;
      color: #c5a059;
      font-weight: 700;
      font-size: 14px;
    }
    .badge-type {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .badge-kitchen { background: rgba(197, 160, 89, 0.15); color: #c5a059; border: 1px solid rgba(197, 160, 89, 0.3); }
    .badge-cellar { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="brand-title">MAISON ATELIER</div>
        <div class="brand-subtitle">Purveyor & Gastronomic Portfolio Management</div>
      </div>
      <div class="header-links">
        <a href="/">➔ Private Concierge View</a>
      </div>
    </div>

    <div class="grid">
      <!-- 1. Onboard Partner Store / House -->
      <div class="card">
        <div class="card-title">Establish Partner Purveyor</div>
        
        <label>Establishment Code (Unique ID)</label>
        <input id="storeId" placeholder="e.g. m_superbros_frankfurt" />

        <label>House / Restaurant Name</label>
        <input id="storeName" placeholder="e.g. Super Bro's Neapolitan Pizza" />

        <label>Classification</label>
        <select id="storeType">
          <option value="restaurant">Fine Culinary Kitchen (Prepared Meals)</option>
          <option value="grocery">Private Larder & Cellar (Groceries / Provisions)</option>
        </select>

        <label>Culinary Preparation Window (Minutes)</label>
        <input id="storePrep" type="number" placeholder="15" value="15" />

        <label>Location / Diplomatic Address</label>
        <input id="storeAddress" placeholder="e.g. Oeder Weg 55-57, 60318 Frankfurt am Main" />

        <button class="btn-gold" onclick="addMerchant()">Register to Portfolio</button>
      </div>

      <!-- 2. Add Gastronomic Dish / Item -->
      <div class="card">
        <div class="card-title">Curate Menu Offering</div>

        <label>Originating House</label>
        <select id="itemStoreSelect">
          <option value="">Awaiting portfolio retrieval...</option>
        </select>

        <label>Offering / Dish Designation</label>
        <input id="itemName" placeholder="e.g. Pizza Super Bro's with Crushed Pistachios" />

        <label>Consideration (€ EUR)</label>
        <input id="itemPrice" type="number" step="0.01" placeholder="16.50" />

        <label>Culinary & Sommelier Dossier (For Gemini AI)</label>
        <textarea id="itemDesc" placeholder="San Marzano tomato sauce, Fior di Latte mozzarella, Italian cooked ham, and roasted pistachios." rows="2"></textarea>

        <button class="btn-gold" onclick="addItem()">Commit to Catalog</button>
      </div>
    </div>

    <!-- Live Portfolio Table -->
    <div class="card">
      <div class="card-title">Live Portfolio Allocation (Supabase PostgreSQL Synchronized)</div>
      <div class="table-wrapper" id="catalogView">
        <p style="color: #71717a; font-size: 13px;">Retrieving active purveyors...</p>
      </div>
    </div>
  </div>

  <script>
    async function loadCatalog() {
      try {
        const res = await fetch('/api/admin/catalog');
        const data = await res.json();
        
        const storeSelect = document.getElementById('itemStoreSelect');
        storeSelect.innerHTML = '';
        data.merchants.forEach(m => {
          storeSelect.innerHTML += `<option value="${m.id}">${m.name} (${m.type === 'restaurant' ? 'Kitchen' : 'Larder'})</option>`;
        });

        const container = document.getElementById('catalogView');
        let html = '<table><thead><tr><th>House / Purveyor</th><th>Classification</th><th>Offering</th><th>Consideration</th><th>Culinary Profile</th></tr></thead><tbody>';
        
        data.items.forEach(it => {
          const store = data.merchants.find(m => m.id === it.merchant_id);
          const isKitchen = !store || store.type === 'restaurant';
          html += `<tr>
            <td style="color: #f5f5f7; font-weight: 600;">${store ? store.name : it.merchant_id}</td>
            <td><span class="badge-type ${isKitchen ? 'badge-kitchen' : 'badge-cellar'}">${isKitchen ? 'Kitchen' : 'Larder'}</span></td>
            <td style="font-weight: 600; color: #e4e4e7;">${it.name}</td>
            <td class="price-tag">€${Number(it.price).toFixed(2)}</td>
            <td style="color: #a1a1aa; font-size: 12px; max-width: 280px; line-height: 1.4;">${it.description || '—'}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      } catch (e) {
        console.error(e);
      }
    }

    async function addMerchant() {
      const id = document.getElementById('storeId').value.trim();
      const name = document.getElementById('storeName').value.trim();
      const type = document.getElementById('storeType').value;
      const prep_time_minutes = Number(document.getElementById('storePrep').value) || 15;
      const address = document.getElementById('storeAddress').value.trim();

      if (!id || !name) return alert('Please define both Establishment Code and House Name.');

      const res = await fetch('/api/admin/merchants', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, type, prep_time_minutes, address })
      });
      const data = await res.json();
      alert(data.message || 'Purveyor registered successfully.');
      loadCatalog();
    }

    async function addItem() {
      const merchant_id = document.getElementById('itemStoreSelect').value;
      const name = document.getElementById('itemName').value.trim();
      const price = Number(document.getElementById('itemPrice').value);
      const description = document.getElementById('itemDesc').value.trim();
      const id = 'it_' + Date.now();

      if (!name || isNaN(price)) return alert('Please enter both Item Designation and Valid Consideration.');

      const res = await fetch('/api/admin/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, merchant_id, name, price, description })
      });
      const data = await res.json();
      alert(data.message || 'Culinary offering committed to catalog.');
      loadCatalog();
    }

    loadCatalog();
  </script>
</body>
</html>
