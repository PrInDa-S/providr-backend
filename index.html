<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Providr — AI Delivery & Stripe Checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0d11; color: #fff; display: flex; justify-content: center; padding: 18px; }
    .container { width: 100%; max-width: 480px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    p.subtitle { color: #9aa0a6; font-size: 13px; margin-bottom: 20px; }
    .gemini-card {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.7), rgba(15, 23, 42, 0.9));
      border: 1.5px solid #818cf8;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
    }
    .gemini-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .gemini-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .lang-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .lang-btn { background: #1e2430; border: 1px solid #334155; color: #94a3b8; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .lang-btn.active { background: #4f46e5; border-color: #818cf8; color: #fff; font-weight: 600; }
    textarea { width: 100%; background: #06080c; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 15px; resize: none; height: 75px; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 8px; }
    button { padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-gemini { flex: 1; background: linear-gradient(90deg, #4f46e5, #9333ea); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-mic { background: #1e2430; border: 1px solid #475569; color: #38bdf8; padding: 12px 16px; display: flex; align-items: center; gap: 6px; }
    .btn-mic.listening { background: #dc2626; border-color: #ef4444; color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .card { background: #131720; border: 1px solid #232b3b; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
    .bundle-item { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .merchant { font-size: 12px; color: #94a3b8; }
    .price { font-weight: 600; font-size: 15px; }
    .divider { height: 1px; background: #232b3b; margin: 12px 0; }
    .ai-reasoning-box { background: rgba(99, 102, 241, 0.1); border-left: 3px solid #818cf8; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; color: #c7d2fe; line-height: 1.4; }
    .btn-stripe { width: 100%; background: #635bff; color: #fff; font-size: 16px; font-weight: 700; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px rgba(99, 91, 255, 0.3); }
    .pantry-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #232b3b; }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 12px; }
    .badge-in { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .badge-low { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge-out { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .btn-outline { background: #1e2430; border: 1px solid #38bdf8; color: #38bdf8; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .success-card { background: rgba(16, 185, 129, 0.15); border: 1.5px solid #10b981; border-radius: 12px; padding: 18px; margin-bottom: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Providr</h1>
    <p class="subtitle">AI-Native Restaurant & Grocery Synchronization</p>

    <!-- Payment Success Notice -->
    <div id="paymentSuccessNotice" style="display: none;" class="success-card">
      <div style="font-size: 24px; margin-bottom: 6px;">🎉</div>
      <h3 style="color: #10b981; font-size: 18px; margin-bottom: 4px;">Payment Succeeded via Stripe!</h3>
      <p id="paidDetails" style="color: #cbd5e1; font-size: 13px;"></p>
      <div style="color: #38bdf8; font-weight: 700; font-size: 12px; margin-top: 8px;">Order Recorded in Supabase & Dispatched!</div>
    </div>

    <!-- Gemini AI Card -->
    <div class="gemini-card">
      <div class="gemini-header">
        <span class="gemini-badge">✨ Gemini AI Engine</span>
        <span id="voiceStatus" style="font-size: 12px; color: #94a3b8;">Voice Ready</span>
      </div>

      <div class="lang-row">
        <button class="lang-btn active" onclick="setLang('en-US', this)">🇬🇧 English</button>
        <button class="lang-btn" onclick="setLang('ur-PK', this)">🇵🇰 اردو (Urdu)</button>
        <button class="lang-btn" onclick="setLang('ar-SA', this)">🇸🇦 العربية</button>
        <button class="lang-btn" onclick="setLang('es-ES', this)">🇪🇸 Español</button>
      </div>

      <textarea id="intentInput" placeholder="Speak or type: 'Dinner for 3, one vegetarian, plus dessert' or 'کچھ میٹھا اور پیزا چاہیے'"></textarea>

      <div class="btn-row">
        <button id="micBtn" class="btn-mic" onclick="toggleVoice()">
          <span id="micIcon">🎙️</span> <span id="micLabel">Speak</span>
        </button>
        <button class="btn-gemini" onclick="generateBundle()">
          <span>✨ Synthesize with Gemini</span>
        </button>
      </div>
    </div>

    <!-- Smart Bundle Display -->
    <div id="bundleContainer" style="display: none;" class="card">
      <div style="color: #818cf8; font-size: 12px; font-weight: 700; margin-bottom: 10px;">SMART BUNDLE READY</div>
      
      <div id="aiReasoning" class="ai-reasoning-box"></div>

      <div class="bundle-item">
        <div>
          <div id="restaurantName" style="font-weight: 600;"></div>
          <div id="restaurantMerchant" class="merchant"></div>
        </div>
        <div id="restaurantPrice" class="price"></div>
      </div>

      <div class="bundle-item">
        <div>
          <div id="groceryName" style="font-weight: 600;"></div>
          <div id="groceryMerchant" class="merchant"></div>
        </div>
        <div id="groceryPrice" class="price"></div>
      </div>

      <div class="divider"></div>
      
      <div class="bundle-item" style="font-size: 17px;">
        <span>Combined Total</span>
        <span id="totalPrice" style="color: #10b981; font-weight: 800;"></span>
      </div>

      <!-- Real Stripe Payment Button -->
      <button class="btn-stripe" onclick="payWithStripe()">
        <span>💳 Pay with Stripe Checkout</span>
      </button>
    </div>

    <!-- Virtual Pantry -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="font-size: 17px;">Virtual Pantry</h3>
        <button class="btn-outline" onclick="loadPantry()">↻ Sync Pantry State</button>
      </div>
      <div id="pantryList"></div>
    </div>
  </div>

  <script>
    let currentBundle = null;
    let selectedLang = 'en-US';
    let recognition = null;
    let isListening = false;

    // Check if returning from Stripe Payment
    window.onload = async () => {
      loadPantry();
      const params = new URLSearchParams(window.location.search);
      if (params.get('payment_success')) {
        const sessionId = params.get('session_id');
        const total = params.get('total');
        const res = await fetch('/api/confirm-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, total })
        });
        const data = await res.json();
        document.getElementById('paymentSuccessNotice').style.display = 'block';
        document.getElementById('paidDetails').innerText = `ID: ${data.orderId} • ETA: ${data.estimatedArrival}`;
        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    };

    // Voice recognition setup
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('micLabel').innerText = 'Listening...';
      };
      recognition.onresult = (event) => {
        document.getElementById('intentInput').value = event.results[0][0].transcript;
        generateBundle();
      };
      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('micLabel').innerText = 'Speak';
      };
    }

    function setLang(langCode, btn) {
      selectedLang = langCode;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (recognition) recognition.lang = selectedLang;
    }

    function toggleVoice() {
      if (!recognition) return alert('Voice not supported.');
      if (isListening) { recognition.stop(); } else { recognition.lang = selectedLang; recognition.start(); }
    }

    async function generateBundle() {
      const query = document.getElementById('intentInput').value;
      if (!query.trim()) return;

      const btn = document.querySelector('.btn-gemini');
      btn.innerText = '✨ Gemini Thinking...';

      try {
        const res = await fetch('/api/bundle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, userId: 'user_123' })
        });
        const data = await res.json();
        currentBundle = data.suggestion;

        document.getElementById('aiReasoning').innerText = '✨ Gemini AI: ' + currentBundle.aiReasoning;
        document.getElementById('restaurantName').innerText = currentBundle.restaurantItem.name;
        document.getElementById('restaurantMerchant').innerText = currentBundle.restaurantItem.merchant;
        document.getElementById('restaurantPrice').innerText = '€' + Number(currentBundle.restaurantItem.price || 0).toFixed(2);

        document.getElementById('groceryName').innerText = currentBundle.groceryItem.name;
        document.getElementById('groceryMerchant').innerText = currentBundle.groceryItem.merchant;
        document.getElementById('groceryPrice').innerText = '€' + Number(currentBundle.groceryItem.price || 0).toFixed(2);

        document.getElementById('totalPrice').innerText = '€' + Number(currentBundle.bundlePrice || 0).toFixed(2);
        document.getElementById('bundleContainer').style.display = 'block';
      } finally {
        btn.innerText = '✨ Synthesize with Gemini';
      }
    }

    // Launch Real Stripe Checkout
    async function payWithStripe() {
      if (!currentBundle) return;
      const btn = document.querySelector('.btn-stripe');
      btn.innerText = 'Redirecting to Stripe...';

      const res = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: 'user_123',
          items: [currentBundle.restaurantItem, currentBundle.groceryItem],
          totalAmount: currentBundle.bundlePrice
        })
      });

      const data = await res.json();
      if (data.url) {
        // Redirect to official Stripe checkout
        window.location.href = data.url;
      } else {
        alert('Stripe Error: ' + (data.error || 'Failed to start payment.'));
        btn.innerText = '💳 Pay with Stripe Checkout';
      }
    }

    async function loadPantry() {
      const res = await fetch('/api/pantry/user_123');
      const data = await res.json();
      const container = document.getElementById('pantryList');
      container.innerHTML = '';

      (data.items || []).forEach(item => {
        let badgeClass = 'badge-in';
        let label = 'In Stock';
        if (item.status === 'low') { badgeClass = 'badge-low'; label = 'Running Low'; }
        if (item.status === 'out_of_stock') { badgeClass = 'badge-out'; label = 'Out of Stock'; }

        container.innerHTML += `
          <div class="pantry-row">
            <div>
              <div style="font-weight: 600; font-size: 15px;">${item.name}</div>
              <div style="color: #80868b; font-size: 12px;">${item.quantity}</div>
            </div>
            <span class="badge ${badgeClass}">${label}</span>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
