<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Providr — Unified Delivery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0d0f12; color: #fff; display: flex; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 480px; }
    h1 { font-size: 28px; margin-bottom: 6px; }
    p.subtitle { color: #9aa0a6; font-size: 14px; margin-bottom: 24px; }
    .card { background: #1a1d24; border: 1px solid #2b303c; border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    textarea { width: 100%; background: #0d0f12; border: 1px solid #2b303c; border-radius: 8px; color: #fff; padding: 12px; font-size: 15px; resize: none; height: 80px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #10b981; color: #fff; margin-top: 14px; }
    .btn-outline { background: #161920; border: 1px solid #38bdf8; color: #38bdf8; width: auto; padding: 8px 14px; font-size: 13px; margin-bottom: 14px; }
    .bundle-item { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .merchant { font-size: 12px; color: #9aa0a6; }
    .price { font-weight: 600; }
    .divider { height: 1px; background: #2b303c; margin: 14px 0; }
    .status-box { background: #112233; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 6px; margin-top: 14px; }
    .status-text { color: #38bdf8; font-size: 13px; font-weight: 600; }
    /* Pantry styles */
    .pantry-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2b303c; }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 12px; }
    .badge-in { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .badge-low { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge-out { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Providr</h1>
    <p class="subtitle">AI-Native Restaurant & Grocery Synchronization</p>

    <!-- Ordering Section -->
    <div class="card">
      <textarea id="intentInput" placeholder="What are you craving or needing? (e.g. pizza and milk)"></textarea>
      <button class="btn-primary" onclick="generateBundle()">Synthesize Order</button>
    </div>

    <!-- Smart Bundle Section -->
    <div id="bundleContainer" style="display: none;" class="card">
      <div style="color: #38bdf8; font-size: 12px; font-weight: 700; margin-bottom: 12px;">SMART BUNDLE READY</div>
      
      <div class="bundle-item">
        <div>
          <div id="restaurantName" style="font-weight: 600;"></div>
          <div id="restaurantMerchant" class="merchant"></div>
        </div>
        <div id="restaurantPrice" class="price"></div>
      </div>

      <div class="bundle-item">
        <div>
          <div id="groceryName" style="font-weight: 600;"></div>
          <div id="groceryMerchant" class="merchant"></div>
        </div>
        <div id="groceryPrice" class="price"></div>
      </div>

      <div class="divider"></div>
      
      <div class="bundle-item" style="font-size: 17px;">
        <span>Total</span>
        <span id="totalPrice" style="color: #10b981;"></span>
      </div>

      <button class="btn-success" onclick="placeOrder()">Pay & Dispatch Courier</button>
      <div id="orderStatus" style="display: none;" class="status-box"></div>
    </div>

    <!-- Virtual Pantry Section -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="font-size: 18px;">Virtual Pantry</h3>
        <button class="btn-outline" onclick="loadPantry()">↻ Sync Pantry State</button>
      </div>
      <div id="pantryList">
        <p style="color: #9aa0a6; font-size: 14px;">Tap 'Sync Pantry State' to load inventory.</p>
      </div>
    </div>
  </div>

  <script>
    let currentBundle = null;

    async function generateBundle() {
      const query = document.getElementById('intentInput').value;
      if (!query.trim()) return;

      const res = await fetch('/api/bundle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, userId: 'user_123' })
      });
      const data = await res.json();
      currentBundle = data.suggestion;

      document.getElementById('restaurantName').innerText = currentBundle.restaurantItem.name;
      document.getElementById('restaurantMerchant').innerText = currentBundle.restaurantItem.merchant;
      document.getElementById('restaurantPrice').innerText = '€' + Number(currentBundle.restaurantItem.price || 0).toFixed(2);

      document.getElementById('groceryName').innerText = currentBundle.groceryItem.name;
      document.getElementById('groceryMerchant').innerText = currentBundle.groceryItem.merchant;
      document.getElementById('groceryPrice').innerText = '€' + Number(currentBundle.groceryItem.price || 0).toFixed(2);

      document.getElementById('totalPrice').innerText = '€' + Number(currentBundle.bundlePrice || 0).toFixed(2);
      document.getElementById('bundleContainer').style.display = 'block';
      document.getElementById('orderStatus').style.display = 'none';
    }

    async function placeOrder() {
      if (!currentBundle) return;
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: 'user_123',
          items: [currentBundle.restaurantItem, currentBundle.groceryItem],
          deliveryAddress: 'Customer Location',
          totalAmount: currentBundle.bundlePrice
        })
      });
      const data = await res.json();
      const statusBox = document.getElementById('orderStatus');
      statusBox.style.display = 'block';
      statusBox.innerHTML = `<div class="status-text">${data.message}</div>
                             <div style="font-size: 12px; margin-top: 4px; color: #cbd5e1;">Tracking ID: ${data.orderId} | ETA: ${data.estimatedArrival}</div>`;
    }

    async function loadPantry() {
      const res = await fetch('/api/pantry/user_123');
      const data = await res.json();
      const container = document.getElementById('pantryList');
      container.innerHTML = '';

      data.items.forEach(item => {
        let badgeClass = 'badge-in';
        let label = 'In Stock';
        if (item.status === 'low') { badgeClass = 'badge-low'; label = 'Running Low'; }
        if (item.status === 'out_of_stock') { badgeClass = 'badge-out'; label = 'Out of Stock'; }

        container.innerHTML += `
          <div class="pantry-row">
            <div>
              <div style="font-weight: 600; font-size: 15px;">${item.name}</div>
              <div style="color: #80868b; font-size: 12px;">${item.quantity}</div>
            </div>
            <span class="badge ${badgeClass}">${label}</span>
          </div>
        `;
      });
    }

    // Auto-load pantry on open
    loadPantry();
  </script>
</body>
</html>
